<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background (Site renkleriyle) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle pattern overlay -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative chart icons (background) -->
  <!-- Bar chart left -->
  <g opacity="0.15" transform="translate(80, 120)">
    <rect x="0" y="180" width="40" height="120" fill="#ffffff" rx="4"/>
    <rect x="60" y="140" width="40" height="160" fill="#ffffff" rx="4"/>
    <rect x="120" y="100" width="40" height="200" fill="#ffffff" rx="4"/>
    <rect x="180" y="160" width="40" height="140" fill="#ffffff" rx="4"/>
  </g>

  <!-- Line chart right -->
  <g opacity="0.15" transform="translate(900, 150)">
    <polyline points="0,180 50,120 100,140 150,80 200,100"
              stroke="#ffffff" stroke-width="8" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="180" r="8" fill="#ffffff"/>
    <circle cx="50" cy="120" r="8" fill="#ffffff"/>
    <circle cx="100" cy="140" r="8" fill="#ffffff"/>
    <circle cx="150" cy="80" r="8" fill="#ffffff"/>
    <circle cx="200" cy="100" r="8" fill="#ffffff"/>
  </g>

  <!-- Main content container -->
  <g transform="translate(600, 315)">
    <!-- Chart icon -->
    <g transform="translate(-500, -180)">
      <circle cx="0" cy="0" r="50" fill="#ffffff" opacity="0.2"/>
      <path d="M -20,-20 L -20,20 M -10,-10 L -10,20 M 0,-15 L 0,20 M 10,0 L 10,20 M 20,5 L 20,20"
            stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Main title -->
    <text x="0" y="-120"
          font-family="Arial, sans-serif"
          font-size="72"
          font-weight="bold"
          fill="#ffffff"
          text-anchor="middle">
      İstatistik Danışmanlık
    </text>

    <!-- Subtitle -->
    <text x="0" y="-40"
          font-family="Arial, sans-serif"
          font-size="40"
          fill="#ffffff"
          text-anchor="middle"
          opacity="0.95">
      Tez &amp; Makale İstatistik Analizi
    </text>

    <!-- Services line -->
    <text x="0" y="20"
          font-family="Arial, sans-serif"
          font-size="32"
          fill="#ffffff"
          text-anchor="middle"
          opacity="0.9">
      SPSS • R • Python • AMOS • Jamovi
    </text>

    <!-- Divider line -->
    <line x1="-250" y1="60" x2="250" y2="60"
          stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- Contact info -->
    <g transform="translate(0, 120)">
      <!-- Email -->
      <g transform="translate(-180, 0)">
        <circle cx="-30" cy="-5" r="18" fill="#ffffff" opacity="0.2"/>
        <text x="0" y="0"
              font-family="Arial, sans-serif"
              font-size="24"
              fill="#ffffff"
              text-anchor="start"
              opacity="0.95">
          info@istatistik-danismanlik.com
        </text>
      </g>

      <!-- Phone -->
      <g transform="translate(120, 0)">
        <circle cx="-30" cy="-5" r="18" fill="#ffffff" opacity="0.2"/>
        <text x="0" y="0"
              font-family="Arial, sans-serif"
              font-size="24"
              fill="#ffffff"
              text-anchor="start"
              opacity="0.95">
          +90 534 867 47 68
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom decorative bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#1a1d2e" opacity="0.3"/>
</svg>
